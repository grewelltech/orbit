name: Release

# Publish binaries bundled with docs on a version tag (e.g. `git tag v0.1.0`).
# Note: builds are CGO-free while ORBIT has no cgo dependency. When the SCTP
# transport (CGO/Linux-only, see docs/DESIGN.md Phase 0) lands, revisit this.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o orbit ./cmd/orbit

      - name: Package
        run: |
          pkg="orbit-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$pkg"
          cp orbit README.md LICENSE "$pkg"/
          cp -r docs "$pkg"/
          tar -czf "$pkg.tar.gz" "$pkg"
          sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            orbit-*.tar.gz
            orbit-*.tar.gz.sha256
