name: Release

# Publish binaries bundled with docs on a version tag (e.g. `git tag v0.1.0`).
# The build matrix produces one archive per platform; the release job then
# computes a single checksums.txt, signs it with cosign (keyless, via this
# workflow's GitHub OIDC identity — no stored key), attaches SLSA build
# provenance, and publishes everything plus install.sh to the GitHub Release.
#
# Note: builds are CGO-free while ORBIT has no cgo dependency. When the SCTP
# transport (CGO/Linux-only, see docs/DESIGN.md Phase 0) lands, revisit this.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o orbit ./cmd/orbit

      - name: Package
        run: |
          pkg="orbit-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$pkg"
          cp orbit README.md LICENSE "$pkg"/
          cp -r docs "$pkg"/
          tar -czf "$pkg.tar.gz" "$pkg"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: orbit-*.tar.gz
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # cosign keyless signing + provenance OIDC
      attestations: write # SLSA build-provenance attestations
    steps:
      - uses: actions/checkout@v4 # for install.sh

      - name: Collect archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum orbit-*.tar.gz > checksums.txt
          echo "---- checksums.txt ----"
          cat checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.cosign.bundle \
            dist/checksums.txt

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/orbit-*.tar.gz

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/orbit-*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.cosign.bundle
            install.sh
