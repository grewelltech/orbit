name: Pages

# Build the Starlight site in site/ and deploy it to GitHub Pages (source:
# GitHub Actions). install.sh is copied from the repo root into the site so it
# is served at https://orbit.grewelltech.com/install.sh from a single source.
#
# The custom domain (orbit.grewelltech.com) is configured in repo Settings →
# Pages, which owns it for an Actions-published site and provisions its TLS
# certificate. Do NOT add a CNAME file to the published artifact: with this
# source, a CNAME in each deploy re-asserts the domain, which re-runs the DNS
# check and resets certificate provisioning (dropping "Enforce HTTPS") on every
# deploy. Settings is the single source of truth for the domain.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "install.sh"
      - "scripts/orbit.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Serve the install scripts from the site root
        run: |
          cp install.sh site/public/install.sh         # verified binary installer
          cp scripts/orbit.sh site/public/orbit.sh      # host service installer
      - name: Install deps
        working-directory: site
        run: npm ci
      - name: Build
        working-directory: site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
