name: CI

on:
  push:
    branches: [main]
  pull_request:

# unit-CI (DESIGN §6): headless, mockable, no live core. The live-core
# suite lives in integration.yml and needs lab infrastructure.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: go test
        run: |
          go run gotest.tools/gotestsum@latest --junitfile junit.xml --format testname -- -race ./...

      - name: build
        run: go build ./...

      - name: test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: junit.xml

  # The dashboard was previously unchecked by CI: a type error or a broken
  # build only surfaced when someone ran `make ui` by hand, and the embedded
  # asset in a release could be stale relative to the source it came from.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build
