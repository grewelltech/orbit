name: CI

on:
  push:
    branches: [main]
  pull_request:

# unit-CI (DESIGN §6): headless, mockable, no live core. The live-core
# suite lives in integration.yml and needs lab infrastructure.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: go test
        run: |
          go run gotest.tools/gotestsum@latest --junitfile junit.xml --format testname -- -race ./...

      - name: build
        run: go build ./...

      - name: test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: junit.xml
