# A fleet/population run (ADR-0004): a generated topology of gNBs and a UE
# population running continuous behaviours (mobility + a traffic mix) for a
# duration. Real-core scale here (10 gNBs, 100 UEs — within SD-Core's ceiling).
#
#   orbit run examples/fleet.yaml -t <target>
#
# The core, keys, gNB IDs, addresses and the N6 responder come from the target
# (docs/targets.md). Its ran.n2_source_ips must hold addresses THIS host owns,
# one per gNB (here 10), since handover needs a distinct SCTP source per gNB.
# Run from a host on the UPF access network.

kind: fleet
name: dc-fleet-soak

topology:
  gnbs:
    count: 10
    layout: grid

fleet:
  count: 100
  distribution: even
  attach_rate: 10/s
  pdu_session: true

behaviors:
  mobility: { model: random_walk, speed: 3m/s, handover: xn }
  traffic:
    mix:
      # Synthetic profiles: loom constant-rate flows (shape-only carriage).
      - { profile: web,   share: 0.4 }
      - { profile: video, share: 0.3, rate: 8Mbps }
      # Real application cohorts: members run loom's app engines through
      # their GTP-U data paths against a stock loomd on the N6 network (the
      # same far end as `orbit ue app …`). One control connection and one
      # TimeSync loop are shared per loomd across the whole fleet; http
      # cohorts share ONE origin, voip members get one answerer each — so a
      # voip cohort must fit its port_min..port_max range (here 101 ports for
      # 0.2 × 100 = 20 calls). Cohort results are reported as p5/p50/p95
      # distributions, and served live as orbit_fleet_app_* gauges when
      # `orbit run --metrics-listen host:port` is set.
      - { app: voip, name: voip-calls, share: 0.2,
          params: { codec: pcmu, port_min: "40000", port_max: "40100" } }
      - { app: http, name: web-real, share: 0.1,
          params: { object_size: 64KB, think: 200ms, tls: "true", tls_insecure: "true" } }

run:
  duration: 10m
