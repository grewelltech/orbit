# Control-plane attach-rate measurement: the whole subscriber pool, registered
# as fast as the core will take them, with no user plane at all.
#
# Why registration-only. A PDU session roughly triples the cost of an attach —
# measured on the LXD testbed, 158 registrations/s against 43 full attaches/s —
# because it pulls in the SMF and UPF on top of AMF/AUSF/UDM/UDR. Separating
# them is what makes an attach-rate number mean something: a single figure that
# silently includes session establishment is not comparable with anyone else's.
#
# What the dashboard shows for this run. UEs reach REGISTERED, not
# SESSION_ACTIVE, so the "sessions active" tile stays at zero and throughput
# stays flat — correctly, because there is no data path. Attach rate, the UE
# population chart, CP latency and the per-gNB distribution are all live. Use
# fleet-testbed-heavy.yaml instead when the user plane is the point.
#
# App cohorts are deliberately absent: they require pdu_session: true, since
# application traffic rides the UEs' GTP-U data paths. So is mobility: a
# handover switches a UE's user-plane path, and without a PDU session there is
# no path to switch (the AMF rejects every attempt, and the scenario validator
# refuses mobility.handover without pdu_session).
#
# How long it runs. With no behaviours there is nothing to do once the
# population is attached, and no scenario option holds an idle run open
# (run.duration only bounds the behaviours), so the run deregisters the fleet
# and completes as soon as the attach phase ends: about 1000 / 158 ≈ 6-7 s on
# the LXD testbed. Watch the attach phase live, or read the final report.

kind: fleet
name: attach-rate

#   orbit runs start-fleet examples/fleet-testbed-attach-rate.yaml -t lxd
#
# Ten gNBs, each with its own N2 source address from the target's pool. An AMF
# keys a gNB's
# association on that address, so distinct IPs are what make ten gNBs ten gNBs
# rather than one association reused.
topology:
  gnbs:
    count: 10
    layout: grid
    spacing_m: 1000

fleet:
  count: 1000
  distribution: even
  # Offered well above what the core can absorb, so the run measures the core's
  # ceiling rather than this number. Concurrency is the real control: throughput
  # peaks near 32 in flight and FALLS above it, as SBI calls between network
  # functions begin to serialize.
  attach_rate: 500/s
  concurrency: 32
  pdu_session: false
