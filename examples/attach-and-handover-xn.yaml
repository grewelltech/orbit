# Attach a UE with a data session, prove the user plane, hand it over via Xn,
# prove it still works, then deregister.
#
# The core, keys and addresses come from a target (docs/targets.md):
#   orbit run examples/attach-and-handover-xn.yaml -t <target>
# Each gNB takes the target's next gNB ID and the next N2/N3 address from its
# pools, so give it at least two of each. The ping and latency echo the
# target's first responder.
#
# The user plane and handover need to run where the UPF's N3 is reachable
# (see docs/USAGE.md "Where things must run").

name: attach-and-handover
description: Attach + data + Xn handover + data continuity

gnbs:
  - { name: gnb-1 }
  - { name: gnb-2 }

ues:
  - { name: ue1, gnb: gnb-1, pdu_session: true }

steps:
  - register: all
  - ping:     { ue: ue1 }
  - latency:  { ue: ue1, probes: 20 }
  - handover: { ue: ue1, to: gnb-2, type: xn }
  - ping:     { ue: ue1 }
  - deregister: all
