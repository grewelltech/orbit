# A fleet run sized for the LXD testbed (testing/lxd-testbed), exercising every
# live-telemetry path: an app cohort (bidirectional, so downlink is real), a
# user-plane latency probe, and separated N2/N3 addressing.
#
#   orbit runs start-fleet examples/fleet-testbed.yaml -t lxd
#   orbit runs watch          # or the dashboard at http://<ran>:8412/
#
# The core, keys, addresses and the N6 responder come from the target; the
# testbed writes one named lxd (testing/lxd-testbed). Its N2 and N3 pools are
# on separate networks.
kind: fleet
name: telemetry-full-check

topology:
  gnbs:
    count: 1
    layout: grid

fleet:
  count: 6
  distribution: even
  attach_rate: 4/s
  pdu_session: true

behaviors:
  traffic:
    mix:
      - { app: http, name: web-real, share: 1.0,
          params: { object_size: 256KB, think: "0" } }
  latency:
    interval: 1s
    ues: 3
    timeout: 1s

run:
  duration: 30s
