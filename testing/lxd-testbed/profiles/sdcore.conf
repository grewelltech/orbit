# Profile `sdcore`: a testbed of its own around SD-Core, in the same shape as the
# default one and able to run beside it on one host. Selected with
# `testbed.sh -p sdcore <command>` or TESTBED_PROFILE=sdcore.
#
# Sourced after the local overrides and before testbed.conf, so these replace
# testbed.conf's defaults and yield to the environment and to
# testbed.sdcore.local.conf / testbed.local.conf.

# Its own LXD objects, VLAN block (160-167, subnets 10.160-167.0.0/24) and UE pool.
: "${TESTBED_PREFIX:=sdcore}"
: "${TESTBED_VLAN_BASE:=160}"
: "${TESTBED_UE_POOL:=100.68.0.0/16}"

: "${TESTBED_CORE_KIND:=sdcore}"

# Node sizing is testbed.conf's: this is the same core as the default testbed,
# measured the same way.
