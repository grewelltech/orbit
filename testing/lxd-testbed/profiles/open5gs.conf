# Profile `open5gs`: a testbed of its own around Open5GS, in the same shape as the
# default one and able to run beside it on one host. Selected with
# `testbed.sh -p open5gs <command>` or TESTBED_PROFILE=open5gs.
#
# Sourced after the local overrides and before testbed.conf, so these replace
# testbed.conf's defaults and yield to the environment and to
# testbed.open5gs.local.conf / testbed.local.conf.

# Its own LXD objects, VLAN block (150-157, subnets 10.150-157.0.0/24) and UE pool.
: "${TESTBED_PREFIX:=open5gs}"
: "${TESTBED_VLAN_BASE:=150}"
: "${TESTBED_UE_POOL:=100.67.0.0/16}"

: "${TESTBED_CORE_KIND:=open5gs}"

# Sized for conformance runs, not for load: this core is not being benchmarked,
# so neither it nor the nodes that drive it need the default testbed's headroom.
: "${TESTBED_CORE_CPU:=8}"
: "${TESTBED_CORE_MEM:=16GiB}"
: "${TESTBED_CORE_DISK:=40GiB}"
: "${TESTBED_RAN_CPU:=8}"
: "${TESTBED_RAN_MEM:=16GiB}"
: "${TESTBED_APP_CPU:=4}"
: "${TESTBED_APP_MEM:=8GiB}"

# What the core step deploys. The defaults live in cores/open5gs.sh; uncomment
# to move one for this testbed (the environment and the local overrides still
# win).
#: "${OPEN5GS_REF:=v2.8.0}"             # git ref of open5gs/open5gs (tag, branch or sha), built on the core node
#: "${OPEN5GS_MONGODB_SERIES:=8.0}"     # MongoDB release series from repo.mongodb.org
#: "${OPEN5GS_INTEGRITY_ORDER:=NIA2, NIA1, NIA0}"
#: "${OPEN5GS_CIPHERING_ORDER:=NEA0, NEA2, NEA1}"
#: "${OPEN5GS_UE_MTU:=1400}"
#: "${OPEN5GS_MAX_UE:=4096}"
#: "${OPEN5GS_LOG_LEVEL:=info}"
