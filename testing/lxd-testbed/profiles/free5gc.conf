# Profile `free5gc`: a testbed of its own around free5GC, in the same shape as the
# default one and able to run beside it on one host. Selected with
# `testbed.sh -p free5gc <command>` or TESTBED_PROFILE=free5gc.
#
# Sourced after the local overrides and before testbed.conf, so these replace
# testbed.conf's defaults and yield to the environment and to
# testbed.free5gc.local.conf / testbed.local.conf.

# Its own LXD objects, VLAN block (140-147, subnets 10.140-147.0.0/24) and UE pool.
: "${TESTBED_PREFIX:=free5gc}"
: "${TESTBED_VLAN_BASE:=140}"
: "${TESTBED_UE_POOL:=100.66.0.0/16}"

: "${TESTBED_CORE_KIND:=free5gc}"

# Sized for conformance runs, not for load: this core is not being benchmarked,
# so neither it nor the nodes that drive it need the default testbed's headroom.
: "${TESTBED_CORE_CPU:=8}"
: "${TESTBED_CORE_MEM:=16GiB}"
: "${TESTBED_CORE_DISK:=40GiB}"
: "${TESTBED_RAN_CPU:=8}"
: "${TESTBED_RAN_MEM:=16GiB}"
: "${TESTBED_APP_CPU:=4}"
: "${TESTBED_APP_MEM:=8GiB}"
