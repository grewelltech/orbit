# SD-Core as Aether OnRamp v2.3.0 (2026-05-26) ships it: SD-Core chart 4.0.0
# and the NF images it names, with OnRamp's legacy UPF networking. The
# reference for SD-Core's conformance before the ORBIT work began
# (2026-07-02); compare with the sdcore profile, which builds main.
: "${TESTBED_PREFIX:=sdcpre}"
: "${TESTBED_VLAN_BASE:=170}"
: "${TESTBED_UE_POOL:=100.69.0.0/16}"
: "${TESTBED_CORE_KIND:=sdcore}"
: "${TESTBED_SHAPE:=minimal}"
: "${TESTBED_ONRAMP_NET:=legacy}"
: "${ONRAMP_VERSION:=v2.3.0}"
: "${SDCORE_CHART_VERSION:=4.0.0}"
: "${SDCORE_NF_REF=}"
# The chart default: End Markers off, as OnRamp v2.3.0 deploys the UPF.
: "${TESTBED_UPF_END_MARKER:=false}"
# OnRamp v2.3.0's values serve PLMN 208/93 (later releases standardise on
# 001/01); ORBIT and the subscriber IMSIs follow the release.
: "${TESTBED_MCC:=208}"
: "${TESTBED_MNC:=93}"
: "${TESTBED_SUB_START:=208930100007500}"
