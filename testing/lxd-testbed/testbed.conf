# Defaults for the LXD testbed. Every value here can be overridden by an
# environment variable of the same name, by a local override file (see
# TESTBED_LOCAL_CONF below) which is gitignored, or by a profile
# (profiles/<name>.conf, selected with `testbed.sh -p <name>`), which moves the
# whole testbed to a prefix, VLAN block, UE pool and core kind of its own.
# Precedence, highest first: environment, testbed.<profile>.local.conf,
# testbed.local.conf, the profile, this file.
#
# Nothing site-specific belongs in this file — it is committed. Put addresses,
# paths and keys that are particular to one machine in the local override.
#
# The shape is the sdcore-lab "Ref 2" small-site reference
# (reference-deployments/ref2-site/DESIGN.md in grewelltech/aether-sdcore-infosite):
# one 802.1Q trunk per site, a site router that owns every gateway and does NAT
# only at the Internet edge, a routed UE pool, and a second RAN machine two
# routed hops away over an emulated WAN. ORBIT is measured against that shape
# because it is the one the lab has standardised on; the parameters below move
# it to a block of its own so it can run next to a Ref 2 replica on one host.

# ── Naming ───────────────────────────────────────────────────────────────────
# Every LXD object this script creates is prefixed, so the testbed can be torn
# down exactly and cannot collide with an unrelated environment on the same
# host (the Ref 2 replica uses `ref2-`, the aether-ops dev environment
# `aether-`). Keep it to 8 characters: LXD bridge names are Linux interface
# names, capped at 15, and the longest suffix here is `-ftrunk`.
: "${TESTBED_PREFIX:=orbit}"

# ── Core kind ────────────────────────────────────────────────────────────────
# The 5G core the testbed is built around; one of the files in cores/:
#
#   sdcore   SD-Core via Aether OnRamp on Kubernetes, with a control node
#            running aether-ops. The UPF attaches to the core node's n3/n6 by
#            macvlan.
#   free5gc  free5GC on the core node's host network. No control node.
#   open5gs  Open5GS on the core node's host network. No control node.
#
# The site around the core is the same for every kind. For a core on the host
# network the core node itself holds the UPF's N3 and N6 addresses.
: "${TESTBED_CORE_KIND:=sdcore}"

# ── Shape ────────────────────────────────────────────────────────────────────
# Which parts of the site exist.
#
#   site     everything: the site router, the far site over the WAN emulator,
#            the app node, and the control node if the core kind has one.
#   minimal  two nodes, <prefix>-core and <prefix>-ran, on one trunk carrying
#            N2, N3 and N6. Each has an `uplink` NIC on TESTBED_UPLINK_NET
#            (DHCP) for management and the Internet; nothing routes or NATs
#            between the VLANs. The RAN node also holds the app's N6 address
#            and runs the responder, so a UE's traffic still crosses
#            N3 -> UPF -> N6. For conformance work.
#
# Each part can be set on its own (true/false); empty takes the shape's value.
# The far site and the control node need the router.
: "${TESTBED_SHAPE:=site}"
: "${TESTBED_WITH_ROUTER:=}"   # r-site: gateways, OAM VLAN, NAT to the Internet
: "${TESTBED_WITH_FAR:=}"      # r-ran, wanem, the far RAN node
: "${TESTBED_WITH_APP:=}"      # the app node; without it the RAN node is the responder
: "${TESTBED_WITH_CTRL:=}"     # the control node (core kinds that have one)

# ── VLANs and subnets ────────────────────────────────────────────────────────
# Ref 2 numbers its segments so that the VLAN id IS the second octet of the
# subnet: VLAN 120 carries 10.120.0.0/24, and so on through 127. A capture, a
# routing table or a switch port is then self-describing. This testbed keeps
# the rule and moves the block up by ten (130–137) so it can coexist with a
# live Ref 2 replica on the same host without two identical address plans in
# `lxc list`; set TESTBED_VLAN_BASE=120 for a byte-identical replica.
#
#   base+0  oam      operator access, SSH, Kubernetes API; no 3GPP traffic
#   base+1  n2       gNB <-> AMF, NGAP over SCTP           (core site)
#   base+2  n3       gNB <-> UPF, GTP-U                    (core site)
#   base+3  n6       UPF <-> data network (app/responder)
#   base+4  wan      r-site <-> r-ran point-to-point /30, through wanem
#   base+5  far n2   far-site gNBs' N2 (reaches the AMF via two routers)
#   base+6  far n3   far-site gNBs' N3 (the UPF's ran_subnet)
#   base+7  far oam  far-site management
: "${TESTBED_VLAN_BASE:=130}"
: "${TESTBED_VLAN_OAM:=$((TESTBED_VLAN_BASE + 0))}"
: "${TESTBED_VLAN_N2:=$((TESTBED_VLAN_BASE + 1))}"
: "${TESTBED_VLAN_N3:=$((TESTBED_VLAN_BASE + 2))}"
: "${TESTBED_VLAN_N6:=$((TESTBED_VLAN_BASE + 3))}"
: "${TESTBED_VLAN_WAN:=$((TESTBED_VLAN_BASE + 4))}"
: "${TESTBED_VLAN_FAR_N2:=$((TESTBED_VLAN_BASE + 5))}"
: "${TESTBED_VLAN_FAR_N3:=$((TESTBED_VLAN_BASE + 6))}"
: "${TESTBED_VLAN_FAR_OAM:=$((TESTBED_VLAN_BASE + 7))}"

# A /24 per segment, as in Ref 2. The gNB slots and node addresses below all
# fit in the last octet; UE addresses come from TESTBED_UE_POOL, not from here.
: "${TESTBED_NET_OAM:=10.$TESTBED_VLAN_OAM.0.0/24}"
: "${TESTBED_NET_N2:=10.$TESTBED_VLAN_N2.0.0/24}"
: "${TESTBED_NET_N3:=10.$TESTBED_VLAN_N3.0.0/24}"
: "${TESTBED_NET_N6:=10.$TESTBED_VLAN_N6.0.0/24}"
: "${TESTBED_NET_WAN:=10.$TESTBED_VLAN_WAN.0.0/30}"
: "${TESTBED_NET_FAR_N2:=10.$TESTBED_VLAN_FAR_N2.0.0/24}"
: "${TESTBED_NET_FAR_N3:=10.$TESTBED_VLAN_FAR_N3.0.0/24}"
: "${TESTBED_NET_FAR_OAM:=10.$TESTBED_VLAN_FAR_OAM.0.0/24}"

# Last octet of each node on every segment it sits on. The routers are .1 on
# every segment they serve (and .1/.2 on the WAN /30), as any site router would
# be. The gNB slots are Ref 2's: slot n uses .20+n on N2 and N3, so ten gNBs
# per RAN machine are .21–.30.
: "${TESTBED_HOST_WANEM:=5}"      # oam only
: "${TESTBED_HOST_CTRL:=6}"       # oam only; Ref 2 has no control node, so it takes a free slot below the core
: "${TESTBED_HOST_CORE:=10}"      # oam, n2 (the AMF); n3/n6 carry no host address unless the UPF runs on the host network
: "${TESTBED_HOST_RAN:=21}"       # first gNB slot on both RAN machines; oam address too
: "${TESTBED_HOST_APP:=30}"       # oam, n6

# The bridge the site router's uplink plugs into. It must already exist and
# hand out DHCP with NAT — LXD's default `lxdbr0` does — because r-site is the
# only node with a path off the testbed; everything else reaches the Internet
# through its NAT, exactly as the site would.
: "${TESTBED_UPLINK_NET:=lxdbr0}"

# Resolvers handed to every node (they go out through r-site's NAT).
: "${TESTBED_DNS:=8.8.8.8, 1.1.1.1}"

# MTU of every testbed-internal link: the four bridges, each node's trunk/WAN
# NIC and VLAN interface, and the WAN emulator's bridge. The UPF's N3/N6
# macvlans inherit it from the core node's n3/n6 at pod start, so nothing in the
# chart needs changing. Jumbo frames (9000) are the default because the user
# plane is packet-rate-bound at 1500: measured on this testbed, the single-UPF
# uplink ceiling rose from ~5 Gbps to ~18 Gbps (3.4x) moving 1500 -> 9000, with
# the UPF host still under 12% CPU. The uplink NIC (r-site's path off the
# testbed) is deliberately left at the host's default: the Internet edge is
# almost certainly 1500, and a jumbo frame there would be black-holed. Set 1500
# for a standard-MTU run.
: "${TESTBED_MTU:=9000}"

# ── Node sizing ──────────────────────────────────────────────────────────────
# The routers and the WAN emulator forward packets and nothing else.
: "${TESTBED_RTR_CPU:=2}"
: "${TESTBED_RTR_MEM:=2GiB}"
: "${TESTBED_RTR_DISK:=20GiB}"

# The control node runs the aether-ops daemon, which is a Go service with a
# SQLite store plus an Ansible/OnRamp working tree. It does no 5G work itself,
# so it is the smallest node — but it BUILDS aether-ops (and its React frontend)
# from source, which is what the disk is for: a Go module cache, a node_modules
# tree and an OnRamp checkout do not fit comfortably in 20 GiB.
: "${TESTBED_CTRL_CPU:=4}"
: "${TESTBED_CTRL_MEM:=8GiB}"
: "${TESTBED_CTRL_DISK:=40GiB}"

# The core runs a Kubernetes-hosted 5G core, so it is deliberately the largest.
#
# 8 vCPU was the original sizing and it is the binding constraint on attach
# rate, not SD-Core: at 8 vCPU the node runs 95% busy during an attach storm
# and saturates near 60 registrations/s, with throughput flat while latency
# grows linearly with concurrency. A 32-core core node reaches roughly 3x that.
#
# Measure before shrinking these. A too-small core node does not fail — it
# quietly reports a low ceiling that reads as a property of the core under
# test, which is exactly the wrong conclusion to draw from a benchmark.
: "${TESTBED_CORE_CPU:=32}"
: "${TESTBED_CORE_MEM:=64GiB}"
: "${TESTBED_CORE_DISK:=60GiB}"

# Each RAN node runs ORBIT itself: a 1000-UE fleet with app traffic is real work
# (crypto per attach, GTP-U encap per packet, a loom engine per cohort member),
# and a starved RAN node caps the offered load before the core ever does. The
# far node gets the same so a near-vs-far comparison measures the path, not the
# machine.
: "${TESTBED_RAN_CPU:=16}"
: "${TESTBED_RAN_MEM:=32GiB}"
: "${TESTBED_RAN_DISK:=30GiB}"

# The app node terminates every flow the fleet generates on N6.
: "${TESTBED_APP_CPU:=8}"
: "${TESTBED_APP_MEM:=16GiB}"
: "${TESTBED_APP_DISK:=20GiB}"

# ── LXD ──────────────────────────────────────────────────────────────────────
# Storage pool the VM root disks land on. Empty means "whatever LXD calls
# default"; set it if this host has several pools and the default is wrong.
: "${TESTBED_STORAGE_POOL:=default}"

# ── Base image ───────────────────────────────────────────────────────────────
# A stock Ubuntu cloud image. It carries cloud-init (so addressing can be
# injected as network-config, landing in /etc/netplan on disk where Aether
# OnRamp and SD-Core look for it) and the LXD agent (so `lxc exec` works).
# Nothing is built locally.
: "${TESTBED_IMAGE:=ubuntu:24.04}"

# Scratch space for anything the script caches (built binaries, source clones,
# the responder and API tokens, the core's version record). One directory per
# testbed, keyed by the prefix: a build or a generated file for one testbed must
# not be picked up by another running beside it. If you set this yourself and
# run more than one testbed, set it per profile.
: "${TESTBED_CACHE_DIR:=${XDG_CACHE_HOME:-$HOME/.cache}/${TESTBED_PREFIX}-lxd-testbed}"

# ── Access ───────────────────────────────────────────────────────────────────
# `lxc exec <node> -- <cmd>` works out of the box via the LXD agent, and
# `testbed.sh console <node>` attaches to the console.
#
# For SSH, point this at a public key and cloud-init installs it for the
# `ubuntu` user on first boot. `testbed.sh ssh <node>` then jumps through
# r-site, the only node the host can reach directly. Leave empty for
# agent/console access only.
: "${TESTBED_SSH_PUBKEY:=}"

# ── Component versions ───────────────────────────────────────────────────────
# Each can be moved without editing anything tracked (environment or
# testbed.local.conf). The core follows upstream main; see below.
: "${ONRAMP_REPO:=https://github.com/opennetworkinglab/aether-onramp.git}"
#
# Everything in the core is built from upstream `main` by default: OnRamp, the
# SD-Core charts (from git, not a published chart) and every NF image (built on
# this host, see SDCORE_NFS below). A testbed measured against the code that is
# about to ship finds the regressions and confirms the fixes that a released
# image cannot. The price is that a rebuild is not reproducible from these
# defaults alone, so `testbed.sh core` records the commit it resolved for every
# component (OnRamp, charts, each NF) in the log and in /etc/orbit/testbed-versions
# on the core node. To reproduce a run, copy those SHAs into the refs below.
#
# Following a branch head has bitten before: OnRamp renamed its values template
# under a working testbed. `testbed.sh core` detects the template by name and
# replaces vars/main.yml's whole core: block anchored on top-level keys, so a
# layout change fails before the install with a message, not half-way through.
: "${ONRAMP_VERSION:=main}"      # git ref (branch, tag or sha)
#
# SD-Core charts. SDCORE_CHARTS_REF is a git ref of sdcore-helm-charts, cloned
# on the core node and installed as local charts. Set SDCORE_CHART_VERSION to a
# published version (e.g. 6.1.2) to install oci://ghcr.io/omec-project/sd-core
# instead; it takes precedence over the git ref.
: "${SDCORE_CHARTS_REPO:=https://github.com/omec-project/sdcore-helm-charts.git}"
: "${SDCORE_CHARTS_REF:=main}"
: "${SDCORE_CHART_VERSION:=}"
#
# SD-Core NF images, built on this host with each repository's own
# `make docker-build` and loaded straight into the core node's containerd (no
# registry). They are tagged SDCORE_IMAGE_PREFIX…:tb-<sha>, so `crictl images`
# on the core says exactly what is running.
#
# SDCORE_NF_REF is the ref every NF is built at. Pin one NF back with
# SDCORE_REF_<NF>, e.g. SDCORE_REF_UPF=rel-2.6.3. Empty SDCORE_NF_REF builds
# nothing and runs the images the charts name.
#
# Needs docker on this host. The first build takes a while (BESS compiles DPDK);
# an image already built at the same commit is reused.
: "${SDCORE_NF_REF:=main}"
: "${SDCORE_NF_ORG:=https://github.com/omec-project}"
: "${SDCORE_NFS:=amf ausf nrf nssf pcf smf udm udr webconsole metricfunc simapp upf}"
: "${SDCORE_IMAGE_PREFIX:=testbed.local/omec-project/}"
# BESS is compiled for this CPU (the UPF Makefile's default). LXD VMs see the
# host CPU, so `native` matches the core node; set e.g. haswell for a VM that
# runs on a different machine than the one that built it.
: "${SDCORE_UPF_CPU:=native}"
: "${ORBIT_VERSION:=}"           # ORBIT git ref to build for the RAN and app nodes; empty = working tree
: "${AETHER_OPS_REF:=main}"      # aether-ops git ref built on the control node
#
# wanemd is the WAN emulator on the wanem node (a bump in the wire between the
# two site routers). Built on the host like ORBIT, because the repository is
# private: the host's git credentials never reach a node.
: "${WANEMD_REPO:=https://github.com/bgrewell/wanemd}"
: "${WANEMD_VERSION:=}"          # git ref; empty = default branch

# ── Control node (aether-ops) ────────────────────────────────────────────────
# aether-ops (github.com/aether-gui/aether-ops) is the management daemon for an
# Aether deployment: a REST API that drives OnRamp, registers nodes and reports
# on the running core. It lives on its own node so the thing doing the managing
# is not also the thing under test — a core node that has to be rebuilt should
# not take the tool that rebuilds it with it.
#
# The control node holds a management (oam) address ONLY. It deploys over SSH
# on the management plane and has no business on a 3GPP reference point; giving
# it an N2 or N3 foot would let a bug there generate traffic that looks like a
# gNB's.
#
# The repository is private. The token is read from `gh auth token` at install
# time and passed into the node's environment for the duration of the install,
# so nothing is written to this file and nothing lands on the host process list.
# Install fails with a clear message if `gh` is not authenticated.
: "${AETHER_OPS_PORT:=8186}"           # API and UI; bound to 0.0.0.0 on the ctrl node
: "${AETHER_OPS_FRONTEND_REF:=}"       # aether-ops-web ref; empty = whatever AETHER_OPS_REF pins
: "${AETHER_OPS_REPO:=aether-gui/aether-ops}"

# Toolchain the control node needs to build aether-ops from source. Pinned
# rather than "latest" so a rebuild six months from now produces the same
# daemon. These match the versions aether-ops's own LXD test environment
# installs, which is the combination its build is actually exercised against.
: "${AETHER_OPS_GO_VERSION:=1.25.4}"
: "${AETHER_OPS_NODE_MAJOR:=22}"

# The service account the daemon uses to reach the nodes it manages over SSH.
# aether-ops generates an ed25519 keypair on the control node during install
# preflight and never creates one at any other time (ADR-0011); this user and
# that key are then installed on every managed node. Upstream has no supported
# way to do that distribution itself — see AO-2 in aether-ops's KNOWN_ISSUES.md
# — so `testbed.sh keys` does it.
: "${AETHER_OPS_USER:=aether}"

# ── Core (SD-Core via Aether OnRamp) ─────────────────────────────────────────
# Since aether-onramp#263 OnRamp describes the UPF's two sides as attachments
# to named networks (core.networks / core.upf.instances). Here each side is a
# macvlan child of the core node's VLAN interface (n3, n6) whose gateway is the
# site router — so the core node is a host on the site network like any other,
# runs no router or NAT of its own, and the UPF's N3 and N6 are different
# VLANs by construction. Nothing is patched into OnRamp's templates.
: "${TESTBED_ONRAMP_DIR:=/opt/aether-onramp}"

# UPF addresses on N3 and N6 (last octet). Ref 2's .100 on both.
: "${TESTBED_UPF_ACCESS_IP:=100}"
: "${TESTBED_UPF_CORE_IP:=100}"

# Ref 2 has the BESS UPF send GTP-U End Markers on the old tunnel after a path
# switch (upf-end-marker overlay; Orbit's GTPU-END-MARKER-ON-PATH-SWITCH check
# depends on it). Two keys in the UPF's upf.jsonc; `false` leaves the chart
# default (off).
: "${TESTBED_UPF_END_MARKER:=true}"

# Simulated gNBs per RAN machine. Each needs its own N2 source address (an AMF
# keys a gNB's association on it, so handover between two gNBs needs two) and
# gets its own N3 address to match, allocated consecutively from
# TESTBED_HOST_RAN. 10 gNBs on a grid is enough for the mobility model to
# produce real neighbour relations rather than a single hop back and forth.
#
# Changing this on a live testbed does not need a rebuild: `testbed.sh addrs`
# re-applies the addressing to the running nodes.
: "${TESTBED_RAN_GNBS:=10}"

# Each RAN node is handed three ready-made ORBIT targets (ADR-0008), written to
# ~/.config/orbit/targets and preloaded into the dashboard, so neither the CLI
# nor the browser needs a target typed or imported by hand:
#
#   lxd              the whole node — every gNB, the whole subscriber pool.
#   lxd-conformance  a slice for `orbit conformance -t lxd-conformance`.
#   lxd-load         a slice for `orbit load -t lxd-load`.
#
# The conformance and load slices are DISJOINT — different gNB addresses,
# different gNB IDs and different subscribers — so a conformance run and a load
# run can share one node without colliding. TESTBED_CONF_GNBS gNBs (the first
# TESTBED_HOST_RAN slots) and TESTBED_CONF_SUBS subscribers go to conformance;
# the rest go to load. The two RAN nodes also take disjoint halves of the
# subscriber pool (near the low half, far the high half), so a SUPI never
# registers from both sites at once. TESTBED_SUB_COUNT must therefore be even
# and at least 2*TESTBED_CONF_SUBS, and TESTBED_CONF_GNBS must be between 1 and
# TESTBED_RAN_GNBS-1; `testbed.sh ran` checks all three before it writes them.
: "${TESTBED_CONF_GNBS:=3}"
: "${TESTBED_CONF_SUBS:=50}"

# Test subscribers. OnRamp's stock values file provisions only 100, which runs
# out immediately for any population test. Key and OPc are OnRamp's test values
# and are not secrets; they are also what ORBIT is handed in /etc/orbit/env.
: "${TESTBED_SUB_START:=001010100007500}"
: "${TESTBED_KI:=5122250214c33e723a5dd523fc145fc0}"
: "${TESTBED_OPC:=981d464c7c52eb6e5036234984ad0bcf}"
#
# 1000 gives a population run room to be a population, and 100 UEs per gNB
# across the 10-gNB grid above. Well under SD-Core's ~5,000-UE ceiling. ORBIT's
# own integration tests only need the first 100, so they are unaffected.
#
# Warning: changing this requires re-running `testbed.sh core`, which removes
# and reinstalls the helm release (OnRamp's install task does not upgrade in
# place). That is destructive to a running core — unlike TESTBED_RAN_GNBS
# above, which `testbed.sh addrs` applies in place.
: "${TESTBED_SUB_COUNT:=1000}"

# MongoDB CPU floor this testbed expects, checked after the core install.
#
# This used to be a value the script PATCHED onto the running StatefulSet,
# because the Bitnami chart shipped `cpu: 750m` while no other NF was capped at
# all, and a registration costs ~55 MongoDB operations — so mongo throttled and
# capped the attach rate long before anything else was busy.
#
# The chart has since fixed it: measured 2026-09-30 against sd-core as deployed
# by aether-ops v1.0.3, mongodb ships `limits: cpu 4, memory 2Gi`. So this is
# now only a floor to WARN against, not a patch to apply. That matters because
# patching a live core recreated the mongo pod, and its datadir is an emptyDir —
# which took every subscriber and the NRF's NF registry with it.
#
# Keep the check: the old default is one chart version away, and its symptom is
# a low attach ceiling that reads as a property of the core under test.
: "${TESTBED_MONGO_CPU:=4}"

# UE address pool handed out by the core. ROUTED, not NATed: r-site routes it
# to the UPF's N6 address and the app returns traffic via r-site, so a UE
# address appears unchanged on N6 and in the app's logs, as on a real site.
# Ref 2 uses 100.64.0.0/16 (CGNAT space); this takes the next /16 for the same
# coexistence reason as the VLAN block.
#
# Invariant: this must hold TESTBED_SUB_COUNT addresses. It is easy to raise the
# subscriber count and leave the pool behind, and the failure is not obvious —
# subscribers authenticate and register, then PDU session establishment fails
# once the pool runs dry, which reads as a broken core rather than an exhausted
# pool. A /16 holds 65,534.
: "${TESTBED_UE_POOL:=100.65.0.0/16}"

# ── PLMN and slice (OnRamp's defaults; ORBIT is told the same in /etc/orbit/env)
: "${TESTBED_MCC:=001}"
: "${TESTBED_MNC:=01}"
: "${TESTBED_TAC:=1}"
: "${TESTBED_SST:=1}"
: "${TESTBED_SD:=010203}"
: "${TESTBED_DNN:=internet}"

# ── Local overrides ──────────────────────────────────────────────────────────
# Sourced last if present, so a machine can carry its own addresses and paths
# without editing anything tracked.
: "${TESTBED_LOCAL_CONF:=$(dirname "${BASH_SOURCE[0]}")/testbed.local.conf}"
