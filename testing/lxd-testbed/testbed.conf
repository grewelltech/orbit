# Defaults for the LXD testbed. Every value here can be overridden by an
# environment variable of the same name, or by a local override file (see
# TESTBED_LOCAL_CONF below) which is gitignored.
#
# Nothing site-specific belongs in this file — it is committed. Put addresses,
# paths and keys that are particular to one machine in the local override.

# ── Naming ───────────────────────────────────────────────────────────────────
# Every LXD object this script creates is prefixed, so the testbed can be torn
# down exactly and cannot collide with an unrelated environment on the same
# host. A host may already carry an unrelated 5G environment — the aether-ops
# dev environment uses the `aether-` prefix and its own `aether-n2/n3/n6`
# bridges — so keep this distinct from anything else present.
: "${TESTBED_PREFIX:=orbit}"

# ── Networks ─────────────────────────────────────────────────────────────────
# Separated 3GPP reference points. No collapsing: N2, N3 and N6 are distinct
# L2 domains, which is the point of this profile.
#
#   mgmt  operator access (SSH/console); carries no 3GPP traffic
#   n2    gNB <-> AMF, NGAP over SCTP
#   n3    gNB <-> UPF, GTP-U
#   n6    UPF <-> data network (the app/responder side)
#
# The second octet encodes the reference point — 10.1NN.x.x, so N2 is 10.102,
# N3 is 10.103, N6 is 10.106 — which makes a capture or a routing table
# self-describing: the address says which interface it belongs to without
# anyone having to look it up. Management is 10.100 as the odd one out.
#
# Each is a /16 rather than a /24 so a run can grow into thousands of UE or gNB
# addresses without renumbering. The third octet is free for that.
#
# (172.16/12 would encode the same way with 172.22/23/26, but 172.26.0.0 is
# already carrying traffic on this host.)
#
# The host takes .0.1 on each bridge, so the testbed is reachable from the host
# without extra routing.
: "${TESTBED_NET_MGMT:=10.100.0.0/16}"
: "${TESTBED_NET_N2:=10.102.0.0/16}"
: "${TESTBED_NET_N3:=10.103.0.0/16}"
: "${TESTBED_NET_N6:=10.106.0.0/16}"

# Host part assigned to each node, appended to the network's first two octets.
# These become static addresses in the node's netplan, written to disk by
# cloud-init on first boot.
: "${TESTBED_HOST_CORE:=0.10}"
: "${TESTBED_HOST_RAN:=0.20}"
: "${TESTBED_HOST_APP:=0.30}"

# Should the bridges NAT out to the host's uplink? On, because the core install
# pulls container images, Helm charts and packages from the internet. Turn it
# off for a run that must prove it has no external dependency.
: "${TESTBED_NAT:=true}"

# ── Node sizing ──────────────────────────────────────────────────────────────
# The core runs a Kubernetes-hosted 5G core, so it is deliberately the largest.
: "${TESTBED_CORE_CPU:=8}"
: "${TESTBED_CORE_MEM:=16GiB}"
: "${TESTBED_CORE_DISK:=60GiB}"

: "${TESTBED_RAN_CPU:=4}"
: "${TESTBED_RAN_MEM:=8GiB}"
: "${TESTBED_RAN_DISK:=30GiB}"

: "${TESTBED_APP_CPU:=2}"
: "${TESTBED_APP_MEM:=4GiB}"
: "${TESTBED_APP_DISK:=20GiB}"

# ── LXD ──────────────────────────────────────────────────────────────────────
# Storage pool the VM root disks land on. Empty means "whatever LXD calls
# default"; set it if this host has several pools and the default is wrong.
: "${TESTBED_STORAGE_POOL:=default}"

# ── Base image ───────────────────────────────────────────────────────────────
# A stock Ubuntu cloud image. It carries cloud-init (so addressing can be
# injected as network-config, landing in /etc/netplan on disk where Aether
# OnRamp and SD-Core look for it) and the LXD agent (so `lxc exec` works).
# Nothing is built locally.
: "${TESTBED_IMAGE:=ubuntu:24.04}"

# Scratch space for anything the script caches.
: "${TESTBED_CACHE_DIR:=${XDG_CACHE_HOME:-$HOME/.cache}/orbit-lxd-testbed}"

# ── Access ───────────────────────────────────────────────────────────────────
# `lxc exec <node> -- <cmd>` works out of the box via the LXD agent, and
# `testbed.sh console <node>` attaches to the console.
#
# For SSH, point this at a public key and cloud-init installs it for the
# `ubuntu` user on first boot. Leave empty for agent/console access only.
: "${TESTBED_SSH_PUBKEY:=}"

# ── Component versions ───────────────────────────────────────────────────────
# Pinned so a rebuild is reproducible and so a version can be moved without
# editing anything tracked. Empty means "whatever the component's own default
# is" — which is deliberately not the same as "latest", since the default is
# itself pinned by that component.
: "${ONRAMP_REPO:=https://github.com/bengrewell/aether-onramp.git}"
: "${ONRAMP_VERSION:=}"          # git ref (branch, tag or sha); empty = default branch
: "${SDCORE_CHART_VERSION:=}"    # SD-Core Helm chart; empty = OnRamp's pin
: "${ORBIT_VERSION:=}"           # ORBIT git ref to build on the RAN node; empty = main
: "${LOOM_VERSION:=}"            # loom git ref for the reflector; empty = ORBIT's pin

# ── Local overrides ──────────────────────────────────────────────────────────
# Sourced last if present, so a machine can carry its own addresses and paths
# without editing anything tracked.
: "${TESTBED_LOCAL_CONF:=$(dirname "${BASH_SOURCE[0]}")/testbed.local.conf}"
