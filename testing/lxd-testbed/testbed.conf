# Defaults for the LXD testbed. Every value here can be overridden by an
# environment variable of the same name, or by a local override file (see
# TESTBED_LOCAL_CONF below) which is gitignored.
#
# Nothing site-specific belongs in this file — it is committed. Put addresses,
# paths and keys that are particular to one machine in the local override.

# ── Naming ───────────────────────────────────────────────────────────────────
# Every LXD object this script creates is prefixed, so the testbed can be torn
# down exactly and cannot collide with an unrelated environment on the same
# host. A host may already carry an unrelated 5G environment — the aether-ops
# dev environment uses the `aether-` prefix and its own `aether-n2/n3/n6`
# bridges — so keep this distinct from anything else present.
: "${TESTBED_PREFIX:=orbit}"

# ── Networks ─────────────────────────────────────────────────────────────────
# Separated 3GPP reference points. No collapsing: N2, N3 and N6 are distinct
# L2 domains, which is the point of this profile.
#
#   mgmt  operator access (SSH/console); carries no 3GPP traffic
#   n2    gNB <-> AMF, NGAP over SCTP
#   n3    gNB <-> UPF, GTP-U
#   n6    UPF <-> data network (the app/responder side)
#
# The host takes .1 on each bridge, so the testbed is reachable from the host
# without extra routing.
: "${TESTBED_NET_MGMT:=10.60.0.0/24}"
: "${TESTBED_NET_N2:=10.60.2.0/24}"
: "${TESTBED_NET_N3:=10.60.3.0/24}"
: "${TESTBED_NET_N6:=10.60.6.0/24}"

# Host octet assigned to each node on every network it is attached to. These are
# DHCP reservations made by LXD, so the guest needs no in-image configuration —
# the testbox base image already DHCPs every wired interface.
: "${TESTBED_HOST_CORE:=10}"
: "${TESTBED_HOST_RAN:=20}"
: "${TESTBED_HOST_APP:=30}"

# Should the bridges NAT out to the host's uplink? Off by default: a testbed
# that cannot reach the internet cannot quietly depend on it, which is what an
# ephemeral, reproducible environment wants. Turn on if the core's install path
# needs to pull images at bring-up.
: "${TESTBED_NAT:=false}"

# ── Node sizing ──────────────────────────────────────────────────────────────
# The core runs a Kubernetes-hosted 5G core, so it is deliberately the largest.
: "${TESTBED_CORE_CPU:=8}"
: "${TESTBED_CORE_MEM:=16GiB}"
: "${TESTBED_CORE_DISK:=60GiB}"

: "${TESTBED_RAN_CPU:=4}"
: "${TESTBED_RAN_MEM:=8GiB}"
: "${TESTBED_RAN_DISK:=30GiB}"

: "${TESTBED_APP_CPU:=2}"
: "${TESTBED_APP_MEM:=4GiB}"
: "${TESTBED_APP_DISK:=20GiB}"

# ── LXD ──────────────────────────────────────────────────────────────────────
# Storage pool the VM root disks land on. Empty means "whatever LXD calls
# default"; set it if this host has several pools and the default is wrong.
: "${TESTBED_STORAGE_POOL:=default}"

# ── testbox image ────────────────────────────────────────────────────────────
# Where the testbox source lives. If unset the script clones it into the cache
# directory below, so a fresh host needs no manual setup.
: "${TESTBOX_REPO:=https://github.com/bgrewell/testbox.git}"
: "${TESTBOX_DIR:=}"

# Path to a prebuilt testbox raw image. Set this to skip building entirely,
# which is the fast path once an image exists.
: "${TESTBOX_IMAGE:=}"

# Scratch space for the clone, the built image and the import metadata.
: "${TESTBED_CACHE_DIR:=${XDG_CACHE_HOME:-$HOME/.cache}/orbit-lxd-testbed}"

# ── Access ───────────────────────────────────────────────────────────────────
# The testbox image autologins root on the serial console, so `testbed.sh
# console <node>` always works and needs no key.
#
# For SSH, a public key must be baked in at image build time: the image carries
# no cloud-init and LXD's agent is not present in it, so there is no way to
# inject one afterwards. Point this at a public key to have the build stage it
# into the image. Leave empty to build an image with console access only.
: "${TESTBED_SSH_PUBKEY:=}"

# ── Local overrides ──────────────────────────────────────────────────────────
# Sourced last if present, so a machine can carry its own addresses and paths
# without editing anything tracked.
: "${TESTBED_LOCAL_CONF:=$(dirname "${BASH_SOURCE[0]}")/testbed.local.conf}"
