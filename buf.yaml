version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # StateStream streams StateEvent; the streamed element reads better as
    # StateEvent than the convention's StateStreamResponse.
    - RPC_RESPONSE_STANDARD_NAME
    # Handover and XnHandover deliberately share HandoverRequest/Response:
    # same parameters and result, different mobility procedure.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
breaking:
  use:
    - FILE
