version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  # TypeScript for the dashboard, from the same protos as Go. protoc-gen-es v2
  # emits service descriptors too, so the browser Connect client needs no
  # separate connect-es plugin. The binary comes from web/node_modules.
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
inputs:
  - directory: proto
