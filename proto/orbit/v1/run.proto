syntax = "proto3";

package orbit.v1;

import "orbit/v1/cell.proto";
import "orbit/v1/ue.proto";

option go_package = "github.com/bgrewell/orbit/gen/orbit/v1;orbitv1";

// RunService owns test-run execution (ADR-0005): every client — CLI, web,
// desktop — starts and observes runs through it, rather than orchestrating a
// run in its own process. A run has a server-assigned identity, outlives the
// client that started it, and is stopped only by an explicit StopRun.
//
// The surface grows per build-order step: identity, listing, history, and the
// end-of-run report (unary), plus RunTelemetry (live aggregate snapshots). The
// per-run event stream (ADR-0006) arrives in a later step.
service RunService {
  // StartRun launches a run and returns its identity immediately. The run
  // executes asynchronously; poll GetRun or fetch GetRunReport when done.
  rpc StartRun(StartRunRequest) returns (StartRunResponse) {}
  // StopRun requests cancellation. Idempotent; a terminal run is unchanged.
  rpc StopRun(StopRunRequest) returns (StopRunResponse) {}
  // ListRuns returns active and retained runs, newest first.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {}
  // GetRun returns one run's current state, plus a live progress snapshot
  // while it is running.
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {}
  // GetRunReport returns the authoritative end-of-run report. Available only
  // once the run has completed.
  rpc GetRunReport(GetRunReportRequest) returns (GetRunReportResponse) {}

  // RunTelemetry streams periodic, self-contained aggregate snapshots of a run
  // in flight (ADR-0006). Each frame is complete — never a delta — so a dropped
  // frame costs one sample and never accumulates into a wrong picture; the
  // stream may therefore be sampled without lying. The stream ends with a final
  // frame once the run reaches a terminal state.
  rpc RunTelemetry(RunTelemetryRequest) returns (stream TelemetryFrame) {}

  // RunEvents streams discrete occurrences during a run, sequenced per run
  // (ADR-0006). A client resumes from a sequence number; when the requested
  // point has been evicted from the bounded ring, the first event reports how
  // many were dropped, so a gap is detectable rather than silent. The stream
  // ends once the run is terminal and its events are drained.
  rpc RunEvents(RunEventsRequest) returns (stream RunEvent) {}
}

// RunKind is what a run does. Only LOAD is executable in this slice; the others
// are reserved so the schema does not renumber when they land.
enum RunKind {
  RUN_KIND_UNSPECIFIED = 0;
  RUN_KIND_LOAD = 1;
  RUN_KIND_FLEET = 2;
  RUN_KIND_SCENARIO = 3;
  RUN_KIND_CONFORMANCE = 4;
}

// RunState is a run's lifecycle position:
// PENDING → RUNNING → (DRAINING) → COMPLETE | FAILED | CANCELLED.
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_PENDING = 1;
  RUN_STATE_RUNNING = 2;
  RUN_STATE_DRAINING = 3;
  RUN_STATE_COMPLETE = 4;
  RUN_STATE_FAILED = 5;
  RUN_STATE_CANCELLED = 6;
}

// Run is a run's identity and lifecycle.
message Run {
  string run_id = 1;              // server-assigned, e.g. "run-7f3a91c2"
  RunKind kind = 2;
  string name = 3;                // caller-supplied label
  RunState state = 4;
  int64 started_unix_nano = 5;
  int64 ended_unix_nano = 6;      // 0 while not terminal
  string error = 7;               // set when state == RUN_STATE_FAILED
}

// LoadRunSpec parameterises a rate-controlled attach storm. It mirrors the
// `orbit load` flags; credentials travel in the request because the server
// owns execution (ADR-0005) and the listener is lab-internal.
message LoadRunSpec {
  string amf_address = 1;
  // gNBs to mux UEs across. UE i attaches through gNBs[i % len].
  repeated GnbConfig gnbs = 2;
  string base_imsi = 3;           // first SUPI; each UE increments it
  uint32 count = 4;               // UEs to attach (ignored when duration_ms > 0)
  Credentials credentials = 5;
  // Offered attach rate (attaches/sec); 0 = concurrency-bound.
  double rate = 6;
  // Linear ramp start:end over ramp_seconds, overriding rate when > 0.
  double ramp_start = 7;
  double ramp_end = 8;
  uint32 ramp_seconds = 9;
  uint32 concurrency = 10;        // max attaches in flight (0 = 64)
  // Soak: run for this long instead of count (0 = count-bounded).
  uint32 duration_ms = 11;
  // Soak: resource-sample cadence (0 = off).
  uint32 sample_interval_ms = 12;
  // Optional PDU session per UE.
  PDUSession pdu_session = 13;
  string gnb_n3_addr = 14;        // gNB N3 for the data path (with pdu_session)
}

// FleetRunSpec launches a population run (topology + attach + continuous
// mobility + traffic) from a fleet scenario. The scenario travels as its YAML
// so the RPC reuses the existing, proven fleet schema rather than re-modelling
// it; credentials travel separately because the server owns execution and
// cannot expand the YAML's ${ENV} against the client's secrets.
message FleetRunSpec {
  string scenario_yaml = 1;       // a `kind: fleet` scenario document
  Credentials credentials = 2;
}

message StartRunRequest {
  string name = 1;                // optional label; server names it if empty
  oneof spec {
    LoadRunSpec load = 2;
    FleetRunSpec fleet = 3;
  }
}

message StartRunResponse {
  Run run = 1;
}

message StopRunRequest {
  string run_id = 1;
}

message StopRunResponse {
  Run run = 1;                    // state as of the stop request
}

message ListRunsRequest {
  // Optional filter; RUN_KIND_UNSPECIFIED returns all kinds.
  RunKind kind = 1;
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message GetRunRequest {
  string run_id = 1;
}

// LoadProgress is a live aggregate snapshot of a load run in flight. Cumulative
// values only; an interval rate is the difference between two snapshots.
message LoadProgress {
  int64 elapsed_ms = 1;
  uint32 attempted = 2;
  uint32 succeeded = 3;
  uint32 failed = 4;
  double achieved_rate = 5;       // succeeded per second since the run began
  repeated ProcedureLatency latency = 6;
  // Per-gNB spread of the attach population — where UEs currently sit across
  // the fleet's gNBs. Empty until at least one attempt has been attributed.
  repeated GnbProgress per_gnb = 7;
}

// FleetProgress is a live aggregate snapshot of a fleet run in flight: its
// attach population, mobility outcomes, and the N3 user-plane counters summed
// across every attached UE.
//
// The byte/packet fields are CUMULATIVE over the run — the honest quantity the
// datapath actually holds. The *_bps/*_pps rates are derived by the server
// from consecutive samples on one telemetry stream, so each subscriber gets
// rates over its own frame cadence; they are zero on a stream's first frame,
// which has no interval to divide by.
message FleetProgress {
  int64 elapsed_ms = 1;
  uint32 attached = 2;            // UEs currently attached
  uint32 attach_failed = 3;
  uint32 handovers = 4;
  uint32 handover_errors = 5;
  uint32 traffic_flows = 6;       // synthetic loom flows started
  uint32 app_sessions = 7;        // app-cohort members (voip/http/video)

  // Cumulative N3 user-plane counters, summed across the fleet's UEs. These
  // are the tunnel's own counters, so they cover every behaviour on the data
  // path (synthetic flows and app cohorts alike).
  uint64 uplink_bytes = 8;
  uint64 downlink_bytes = 9;
  uint64 uplink_packets = 10;
  uint64 downlink_packets = 11;

  // Derived rates over the interval since this stream's previous frame.
  double uplink_bps = 12;
  double downlink_bps = 13;
  double uplink_pps = 14;
  double downlink_pps = 15;

  // Per-gNB spread of the attached population. `succeeded` carries the count
  // currently attached on that gNB.
  repeated GnbProgress per_gnb = 16;

  // User-plane round-trip latency: ICMP echoes sent over sampled UEs' own N3
  // data paths, so the figure is the tunnel's RTT rather than the management
  // network's. Absent unless the scenario configures a latency probe —
  // reporting zeros would read as an instant data path rather than as an
  // unmeasured one. Its `procedure` is "user_plane".
  ProcedureLatency up_latency = 17;
  // Probes sent and lost, so a path that stops answering is visible as loss
  // rather than as a percentile quietly computed over survivors.
  uint64 up_probes = 18;
  uint64 up_probes_lost = 19;
}

// GnbProgress is one gNB's share of the attach population in a load run.
message GnbProgress {
  string gnb = 1;                 // gNB name, or "gnb-<id>" when the name is unset
  uint32 attempted = 2;
  uint32 succeeded = 3;
  uint32 failed = 4;
}

// ProcedureLatency is one procedure's live percentile summary, milliseconds.
message ProcedureLatency {
  string procedure = 1;           // "attach", "registration", "pdu_session"
  uint64 count = 2;
  double p50_ms = 3;
  double p90_ms = 4;
  double p99_ms = 5;
  double p999_ms = 6;
  double max_ms = 7;
}

message GetRunResponse {
  Run run = 1;
  // Populated for a LOAD run; empty for other kinds or before any attempt.
  LoadProgress load_progress = 2;
  // Populated for a FLEET run. Its rate fields are always zero: rates are
  // derived from consecutive samples, which a single-shot Get does not have.
  // Subscribe to RunTelemetry for throughput.
  FleetProgress fleet_progress = 3;
}

message RunTelemetryRequest {
  string run_id = 1;
  // Requested cadence. The server clamps it to a supported range and reports
  // the interval it actually applied in each frame.
  uint32 interval_ms = 2;
}

// TelemetryFrame is a complete snapshot of a run's aggregate state at an
// instant — never a delta. Its size is independent of UE count: aggregates
// only, no per-UE rows (per-UE detail is pulled via the UE service).
message TelemetryFrame {
  string run_id = 1;
  int64 unix_nano = 2;
  // The cadence the server applied, which may differ from the requested one.
  uint32 interval_ms = 3;
  // Monotonic within the stream, so a client can detect (not recover) a
  // dropped frame.
  uint64 frame_seq = 4;
  RunState state = 5;
  int64 elapsed_ms = 6;
  // Aggregate progress, by kind. Empty for a kind without live aggregates.
  oneof progress {
    LoadProgress load = 7;
    FleetProgress fleet = 8;
  }
}

message RunEventsRequest {
  string run_id = 1;
  // Resume point: the first sequence number the client wants. 0 = from the
  // oldest still retained.
  uint64 from_seq = 2;
}

enum EventSeverity {
  EVENT_SEVERITY_UNSPECIFIED = 0;
  EVENT_SEVERITY_INFO = 1;
  EVENT_SEVERITY_WARN = 2;
  EVENT_SEVERITY_ERROR = 3;
}

// RunEvent is one discrete occurrence during a run.
message RunEvent {
  uint64 seq = 1;                // monotonic within the run
  int64 unix_nano = 2;
  EventSeverity severity = 3;
  string kind = 4;               // "RUN", "ATTACH", "SLO", ...
  string supi = 5;               // empty for run-scoped events
  string message = 6;
  // Set on the first event of a stream when the requested from_seq had already
  // been evicted: how many events before this one the client will never see.
  uint64 dropped_before = 7;
}

message GetRunReportRequest {
  string run_id = 1;
}

// LoadReport is the authoritative end-of-run result. Unlike LoadProgress it is
// not sampled.
message LoadReport {
  uint32 attempted = 1;
  uint32 succeeded = 2;
  uint32 failed = 3;
  int64 duration_ms = 4;
  double achieved_rate = 5;
  repeated ProcedureLatency latency = 6;
  repeated ResourceSample resources = 7;
}

// ResourceSample is a point-in-time process reading during a soak.
message ResourceSample {
  int64 at_ms = 1;
  uint32 goroutines = 2;
  uint64 rss_bytes = 3;
}

// FleetReport is the end-of-run result of a fleet run.
message FleetReport {
  uint32 attached = 1;
  uint32 attach_failed = 2;
  int64 attach_elapsed_ms = 3;
  uint32 handovers = 4;
  uint32 handover_errors = 5;
  uint32 traffic_flows = 6;
  uint64 traffic_bytes = 7;
  uint32 deregistered = 8;
}

message GetRunReportResponse {
  Run run = 1;
  oneof report {
    LoadReport load = 2;
    FleetReport fleet = 3;
  }
}
