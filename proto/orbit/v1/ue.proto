syntax = "proto3";

package orbit.v1;

import "orbit/v1/cell.proto";

option go_package = "github.com/bgrewell/orbit/gen/orbit/v1;orbitv1";

// UEService registers simulated UEs against a live core and streams their
// lifecycle. One RPC drives the whole control-plane attach (Phase 1a);
// the data plane arrives in Phase 1b.
service UEService {
  // Register attaches one UE (Registration + 5G-AKA + Security Mode +
  // optional PDU session) and returns once it reaches its target state.
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
  // Deregister sends a switch-off Deregistration and releases the UE.
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse) {}
  // Status reports a registered UE's current state.
  rpc Status(StatusRequest) returns (StatusResponse) {}
  // List returns all registered UEs.
  rpc List(ListRequest) returns (ListResponse) {}
  // Ping sends an ICMP echo from the UE through the N3 data path and
  // reports the round trip — the user-plane health check.
  rpc Ping(PingRequest) returns (PingResponse) {}
  // StateStream pushes UE lifecycle transitions as they happen.
  rpc StateStream(StateStreamRequest) returns (stream StateEvent) {}
  // Handover moves a registered UE to a target gNB via an N2 (AMF-mediated)
  // handover. Drives the control plane end to end; the resulting mobility
  // states are pushed on StateStream.
  rpc Handover(HandoverRequest) returns (HandoverResponse) {}
  // XnHandover moves a registered UE to a target gNB via an Xn handover
  // (NGAP PathSwitchRequest; Xn preparation stubbed in-process). Unlike N2,
  // the SD-Core downlink path switch takes effect.
  rpc XnHandover(HandoverRequest) returns (HandoverResponse) {}
  // Traffic runs a loom-generated UDP flow from the UE over its N3 data path
  // and reports throughput — the user-plane load generator.
  rpc Traffic(TrafficRequest) returns (TrafficResponse) {}
  // Latency probes a target over the UE's N3 data path and reports loom's
  // RTT / jitter / loss summary.
  rpc Latency(LatencyRequest) returns (LatencyResponse) {}
  // DataStats reports the per-QFI uplink/downlink counters of a UE's N3
  // data path. A UE whose data path has not been opened yet (nothing has
  // used the tunnel) reports no flows.
  rpc DataStats(DataStatsRequest) returns (DataStatsResponse) {}
  // StartApp starts a real application-traffic session (VoIP today) from a
  // registered UE through its N3 data path to a loom agent on the N6
  // network, and returns a session id. The call runs asynchronously:
  // stream it with AppStream, finish it with StopApp.
  rpc StartApp(StartAppRequest) returns (StartAppResponse) {}
  // AppStream pushes a running app session's interval quality samples
  // (both ends of the call) and correlation events as they happen. The
  // stream ends when the session does.
  rpc AppStream(AppStreamRequest) returns (stream AppSample) {}
  // StopApp ends an app session (one that already ran its duration out is
  // reaped the same way) and returns the both-end report. The session id
  // is forgotten once the report is returned.
  rpc StopApp(StopAppRequest) returns (AppReport) {}
}

// Credentials carries the subscriber secrets. Warning: Ki/OPc are long-term
// secrets — the server redacts them in logs and TLS is expected off-host.
message Credentials {
  // Subscriber key K, 32 hex digits.
  string ki = 1;
  // Operator variant key OPc, 32 hex digits.
  string opc = 2;
}

// PDUSession requests one data session during attach.
message PDUSession {
  uint32 pdu_session_id = 1; // 1-15
  uint32 sst = 2;
  string sd = 3;   // 6 hex digits, optional
  string dnn = 4;  // e.g. "internet"
}

message RegisterRequest {
  // AMF N2 endpoint (host:port).
  string amf_address = 1;
  // gNB identity the UE attaches through.
  GnbConfig gnb = 2;
  // SUPI in IMSI form, e.g. "208930100007500".
  string supi = 3;
  Credentials credentials = 4;
  // Routing indicator for the SUCI (default "0").
  string routing_indicator = 5;
  // Optional PDU session to establish after REGISTERED.
  PDUSession pdu_session = 6;
  // Attach timeout in milliseconds (0 = 20000).
  uint32 timeout_ms = 7;
  // gNB N3 address reported to the UPF so downlink returns here; also the
  // bind address for the data path. Must be reachable from the UPF
  // access-net (empty = data path disabled).
  string gnb_n3_addr = 8;
}

message RegisterResponse {
  string supi = 1;
  bool registered = 2;
  int64 amf_ue_ngap_id = 3;
  bool session_active = 4;
  string pdu_address = 5;  // allocated UE IP
  string upf_address = 6;  // UPF N3 endpoint (for the data plane)
  uint32 upf_teid = 7;
}

message DeregisterRequest {
  string supi = 1;
}

message DeregisterResponse {}

message StatusRequest {
  string supi = 1;
}

// UEStatus is a snapshot of one UE. Registration and mobility are orthogonal
// axes: a UE that has handed over is still SESSION_ACTIVE, so `state` alone
// cannot distinguish a UE whose handover failed from a healthy one — read it
// together with `mobility_state`.
message UEStatus {
  string supi = 1;
  // Registration axis: REGISTERING, REGISTERED, SESSION_ACTIVE, ...
  string state = 2;
  string pdu_address = 3;
  int64 amf_ue_ngap_id = 4;
  // The cell currently serving the UE. Follows the UE across handovers, so it
  // answers "where is this UE now?".
  uint32 serving_gnb_id = 5;
  string serving_gnb_name = 6;
  // Mobility axis, independent of `state`: HANDOVER_STARTED, HANDED_OVER,
  // HANDOVER_FAILED, PATH_SWITCH_COMPLETE. Empty until the UE first moves.
  string mobility_state = 7;
  // When mobility_state was recorded; 0 when the UE has never moved.
  int64 mobility_changed_unix_nano = 8;
}

message StatusResponse {
  UEStatus status = 1;
}

message ListRequest {}

message ListResponse {
  repeated UEStatus ues = 1;
}

message StateStreamRequest {
  // Optional: only stream events for this SUPI (empty = all UEs).
  string supi = 1;
}

message StateEvent {
  string supi = 1;
  string state = 2;
  string detail = 3;
  int64 unix_nano = 4;
}

message PingRequest {
  string supi = 1;
  // Echo target IPv4 (default 8.8.8.8).
  string destination = 2;
  // Number of echoes to send (default 3).
  uint32 count = 3;
}

message PingResponse {
  uint32 sent = 1;
  uint32 received = 2;
  // Round-trip time of the last successful echo, milliseconds.
  double rtt_ms = 3;
  string reply_from = 4;
}

message HandoverRequest {
  // Registered UE to hand over.
  string supi = 1;
  // Target gNB to move the UE to.
  GnbConfig target_gnb = 2;
  // AMF N2 endpoint for the target association (host:port).
  string amf_address = 3;
  // SCTP bind address for the target gNB — use a distinct routed source IP
  // per gNB (see docs/interop/sdcore.md).
  string bind_address = 4;
  // Target gNB N3 address for the downlink tunnel.
  string gnb_n3_addr = 5;
  // Handover timeout in milliseconds (0 = 30000).
  uint32 timeout_ms = 6;
}

message HandoverResponse {
  string supi = 1;
  // The gNB ID the UE is now served by (the target on success).
  uint32 gnb_id = 2;
  // Terminal mobility state: HANDED_OVER or HANDOVER_FAILED.
  string state = 3;
}

message TrafficRequest {
  string supi = 1;
  // Destination host:port for the UDP flow.
  string target = 2;
  // loom rate string, e.g. "50Mbps"; empty = unlimited.
  string rate = 3;
  // Inner UDP payload size (default 1200).
  uint32 packet_size = 4;
  // Flow duration in milliseconds (default 5000).
  uint32 duration_ms = 5;
}

message TrafficResponse {
  uint64 bytes = 1;
  uint64 packets = 2;
  // Achieved application-layer throughput (megabits/sec).
  double mbps = 3;
  uint32 duration_ms = 4;
}

message LatencyRequest {
  string supi = 1;
  // Destination IPv4 to probe (ICMP; no port).
  string target = 2;
  // Number of echoes (default 20).
  uint32 probes = 3;
  // Spacing between echoes, ms (default 50).
  uint32 spacing_ms = 4;
  // Per-echo timeout, ms (default 1000).
  uint32 timeout_ms = 5;
}

message LatencyResponse {
  uint64 sent = 1;
  uint64 received = 2;
  uint64 lost = 3;
  double loss_pct = 4;
  double min_ms = 5;
  double mean_ms = 6;
  double max_ms = 7;
  double jitter_ms = 8;
}

message DataStatsRequest {
  string supi = 1;
}

// QFIStats is one QoS flow's byte and packet counters, both directions,
// counted over the inner (user) IP packets.
message QFIStats {
  uint32 qfi = 1;
  uint64 uplink_packets = 2;
  uint64 uplink_bytes = 3;
  uint64 downlink_packets = 4;
  uint64 downlink_bytes = 5;
}

message DataStatsResponse {
  // Per-QFI counters, ordered by QFI. Empty when the data path has not
  // been opened yet.
  repeated QFIStats flows = 1;
}

message StartAppRequest {
  // Registered UE the call runs from (needs an active PDU session and a
  // gNB N3 address, like Traffic/Latency).
  string supi = 1;
  // loom application engine: "voip" (RTP/RTCP over the dgram bridge),
  // "http" or "video" (real TCP through the per-gNB netstack). The far end
  // of "video" is the "http" app's HTTPOrigin — loom's video player is
  // client-only, the same mapping loom's own controller applies.
  string app = 2;
  // The N6 loomd's control-plane address (host:port) on the MANAGEMENT
  // network. Empty falls back to the server-level default, if configured.
  string peer = 3;
  // loomd control-plane bearer token (empty = server default / no auth).
  string token = 4;
  // Media address override: by default RTP is aimed at peer's host, but
  // the management and N6 data addresses may differ.
  string peer_data_ip = 5;
  // App tuning knobs, passed verbatim to both ends — each engine reads only
  // the keys it documents (voip: codec, ptime, jb_ms, port_min, port_max;
  // http: url_path, objects, object_size, think, tls, tls_ca, tls_insecure,
  // h2, host; video: url_name, ladder, seg_duration, segments,
  // start_threshold, buffer_target, rebuffer_target, abr, plus the http
  // transport keys — ladder/seg_duration/segments configure the origin and
  // double as the player's expectation, one grammar for both sides).
  map<string, string> params = 6;
  // Call duration in milliseconds (0 = 60000). The far-end flow is always
  // duration-bounded — loom's orphan protection.
  uint32 duration_ms = 7;
}

message StartAppResponse {
  // Session id for AppStream / StopApp, e.g. "app-1".
  string session_id = 1;
}

// VoipMetrics mirrors loom's VoIP quality snapshot (metrics.VoIP): RFC 3550
// receiver statistics, RFC 3611 discard accounting, one-way delay with its
// provenance and error bar, and the G.107 E-model rating with its audit
// breakdown.
message VoipMetrics {
  string codec = 1;
  uint64 tx_packets = 2;
  uint64 rx_packets = 3;
  uint64 lost = 4;
  uint64 duplicates = 5;
  uint64 reordered = 6;
  // Network loss and jitter-buffer discard, percent; their sum is the
  // E-model's Ppl input, so delay spikes hurt MOS.
  double loss_pct = 7;
  double discard_pct = 8;
  // RFC 3550 A.8 interarrival jitter and §6.4.1 LSR/DLSR round trip.
  double jitter_ms = 9;
  double rtt_ms = 10;
  // One-way delay with its half-width error bound; owd_method labels the
  // provenance ("timesync", "rtt/2", "assume-synced", "none") so an RTT/2
  // guess is never presented as a measured number.
  double owd_ms = 11;
  double owd_err_ms = 12;
  string owd_method = 13;
  // Gilbert burst ratio (1 = random loss, >1 = bursty).
  double burst_r = 14;
  // Local G.107/G.107.1 rating and MOS-CQE, with the per-term breakdown.
  double r_factor = 15;
  double mos_cq = 16;
  EModelBreakdown emodel = 17;
  // The peer's view of the opposite direction via RTCP XR (0 = no report).
  double remote_r_factor = 18;
  double remote_mos_cq = 19;
  // Holes in media arrival (>3·ptime of silence) — the raw material for
  // handover/outage correlation.
  repeated MediaGap media_gaps = 20;
}

// EModelBreakdown is the G.107 per-term audit trail behind r_factor, so a
// rating can be attributed to delay, loss or codec rather than trusted
// blindly.
message EModelBreakdown {
  double ro = 1;
  double is = 2;
  double idte = 3;
  double idle = 4;
  double idd = 5;
  double id = 6;
  double ie = 7;
  double ie_eff = 8;
  double a = 9;
  double r = 10;
}

// MediaGap is one hole in media arrival.
message MediaGap {
  int64 start_unix_nano = 1;
  int64 end_unix_nano = 2;
  uint32 packets_lost = 3;
}

// HttpMetrics mirrors loom's requester-side HTTP/TLS quality snapshot
// (loom.v1 HttpMetrics): completed/failed request counts, p95
// time-to-first-byte, application-payload goodput, and the mean TCP-connect
// and TLS-handshake times of newly established connections. On the server
// (origin) end only requests/errors/goodput are meaningful — the origin
// measures no client-side latencies.
message HttpMetrics {
  uint64 requests = 1;         // requests completed this interval
  uint64 errors = 2;           // failed requests (also counted in requests)
  double ttfb_ms_p95 = 3;      // p95 time-to-first-byte, milliseconds
  double goodput_mbps = 4;     // application-payload throughput
  double tls_handshake_ms = 5; // mean TLS handshake time (new conns only)
  double connect_ms = 6;       // mean TCP connect time (new conns only)
}

// VideoMetrics mirrors loom's player-side streaming QoE snapshot (loom.v1
// VideoMetrics): stalls, stall time, rebuffer ratio (stall over stall+play
// time, bounded [0,1]), current buffer depth, duration-weighted average
// bitrate, startup delay, and each completed stall as a MediaGap-shaped
// timed entry (packets_lost is 0 for stalls) so stalls align with media
// gaps and handover events on one timeline.
message VideoMetrics {
  uint64 stalls = 1;                  // rebuffer events this interval
  double stall_time_ms = 2;           // total time stalled
  double rebuffer_ratio = 3;          // stall / (stall + play)
  double buffer_ms = 4;               // current buffer depth
  double avg_bitrate_kbps = 5;        // average selected bitrate
  double startup_ms = 6;              // time to first play (0 until playing)
  repeated MediaGap stall_events = 7; // individual stall intervals
}

message AppStreamRequest {
  string session_id = 1;
}

// CorrelationEvent is a timestamped annotation on the call timeline: a hub
// state phase (HANDOVER_STARTED, PATH_SWITCH_COMPLETE, ...), a GTP-U End
// Marker (END_MARKER_RECEIVED), or a mid-call UE release (UE_RELEASED).
message CorrelationEvent {
  int64 unix_nano = 1;
  string kind = 2;
  string detail = 3;
}

// AppSample is one item on an app session's stream: an interval quality
// sample from one end of the call — local (the in-process client behind
// the UE) or remote (the N6 loomd server) — or correlation events.
message AppSample {
  // Sample instant on orbit's clock, nanoseconds since the Unix epoch.
  // Remote samples are re-stamped via the TimeSync offset when available.
  int64 unix_nano = 1;
  // Half-width uncertainty of a re-stamped timestamp, nanoseconds.
  int64 time_err_nano = 2;
  // Clock provenance: "local", "timesync" (re-stamped), or "remote-clock"
  // (no offset yet).
  string time_source = 3;
  // Closing whole-call sample of a telemetry series.
  bool final = 4;
  // Quality snapshot of the end that measured this sample; the populated
  // field matches the session's app. local* is the in-process client behind
  // the UE, remote* the N6 loomd flow. A "video" session's remote end is
  // the http origin, so its remote samples arrive as remote_http.
  VoipMetrics local = 5;
  VoipMetrics remote = 6;
  repeated CorrelationEvent events = 7;
  HttpMetrics local_http = 8;
  HttpMetrics remote_http = 9;
  VideoMetrics local_video = 10;
}

message StopAppRequest {
  string session_id = 1;
}

// AppReport is the both-end result of one app session.
message AppReport {
  string session_id = 1;
  string supi = 2;
  string app = 3;
  // The N6 loomd control address the call was placed against.
  string peer = 4;
  // The far end's advertised media port.
  uint32 data_port = 5;
  int64 started_unix_nano = 6;
  int64 ended_unix_nano = 7;
  // Whole-call cumulative snapshots: local* is the in-process client behind
  // the UE, remote* the far end's final telemetry sample (unset if none
  // arrived). The populated pair matches the session's app; a "video"
  // session's far end is the http origin, so its remote snapshot is
  // remote_http.
  VoipMetrics local = 8;
  VoipMetrics remote = 9;
  // Human-readable correlation timeline, one line per event.
  repeated string annotations = 10;
  // Media gaps from both ends, tagged by end.
  repeated MediaGapSummary media_gaps = 11;
  // The client engine's terminal error (e.g. a handshake timeout), empty
  // for a clean run.
  string error = 12;
  HttpMetrics local_http = 13;
  HttpMetrics remote_http = 14;
  VideoMetrics local_video = 15;
}

// MediaGapSummary is one media gap attributed to the end that observed it.
message MediaGapSummary {
  // "ue" (downlink hole) or "n6" (uplink hole).
  string end = 1;
  int64 start_unix_nano = 2;
  int64 end_unix_nano = 3;
  uint32 packets_lost = 4;
  // clock says whose clock the timestamps are on: "local" (orbit's), or for
  // n6 gaps "timesync" (re-stamped onto orbit's clock via the session's
  // TimeSync offset; time_err_nano carries the re-stamp's half-width
  // uncertainty) or "remote-clock" (no offset was available — the raw remote
  // stamp, NOT comparable with local timestamps and labeled as such).
  string clock = 5;
  int64 time_err_nano = 6;
}
