syntax = "proto3";

package orbit.v1;

import "orbit/v1/conformance.proto";
import "orbit/v1/plan.proto";
import "orbit/v1/run.proto";

option go_package = "github.com/bgrewell/orbit/gen/orbit/v1;orbitv1";

// RunReport is one workload's end-of-run report, with the gates applied to
// it (ADR-0008 §2).
message RunReport {
  string workload = 1;            // the workload's name
  RunKind kind = 2;               // the workload's kind
  oneof report {
    LoadReport load = 3;
    FleetReport fleet = 4;
    ConformanceSummary conformance = 5;
  }
  repeated GateResult gates = 6;
  bool gates_passed = 7;          // every gate passed (true when there are none)
}

// ConformanceSummary is a conformance workload's results.
message ConformanceSummary {
  ConformanceTally tally = 1;
  repeated ConformanceResult results = 2;
}

// GateResult is one gate as the report applied it.
message GateResult {
  Gate gate = 1;
  bool passed = 2;
  double observed = 3;            // the metric's value (SLO gates)
  string detail = 4;              // why it failed, in words
}
