syntax = "proto3";

package orbit.v1;

option go_package = "github.com/bgrewell/orbit/gen/orbit/v1;orbitv1";

import "orbit/v1/ue.proto";

// ConformanceService runs the core conformance / regression suite server-side,
// so the dashboard (and any other client) can drive it and watch results
// arrive instead of shelling out to the CLI.
service ConformanceService {
  // RunConformance executes the suite against a live core and streams one
  // update per test as it completes — a suite run takes tens of seconds, and
  // a client staring at a spinner for that long cannot tell a slow suite from
  // a dead one. The final update carries done=true and the tallies.
  rpc RunConformance(RunConformanceRequest) returns (stream ConformanceUpdate) {}

  // ListConformanceTests reports the registered tests without running them,
  // so a client can render the table skeleton (and per-category counts)
  // before or without a run.
  rpc ListConformanceTests(ListConformanceTestsRequest) returns (ListConformanceTestsResponse) {}
}

message RunConformanceRequest {
  // The core under test. The AMF N2 endpoint and the PLMN are required: the
  // server has no default PLMN, because a wrong-PLMN NG Setup Failure reads
  // like a core finding. The rest defaults as on the CLI.
  string amf_address = 1;         // host:port, required
  string mcc = 2;                 // 3 digits, required
  string mnc = 3;                 // 2 or 3 digits (leading zeros kept), required
  uint32 tac = 4;                 // default 1
  // Supported slice broadcast in NG Setup. NG Setup fails without at least
  // one, so sst defaults to 1; sd has no default (empty = no SD; SD-Core
  // wants "010203").
  uint32 sst = 10;                // default 1
  string sd = 11;                 // default "" (no SD)
  // Base gNB ID. Each test presents a distinct ID above this base, because an
  // AMF does not cleanly re-key a reused gNB ID from a new association.
  uint32 gnb_id_base = 5;         // default 700
  // User-plane checks (the gtpu category) need the UPF's N3 endpoint and a
  // local N3 source address to bind. Absent, those tests report SKIP.
  string upf_n3 = 6;              // host:port
  string n3_bind = 7;             // local ip[:port]
  // Categories to run; empty runs everything.
  repeated string categories = 8;
  // Per-test timeout in seconds (default 15). One hang must not stall the run.
  uint32 per_test_seconds = 9;
  // Local N2 source address for every check's SCTP association, as ip or
  // ip:0. Empty: binds the address the host routes to the AMF from (one
  // address in the INIT), ephemeral port. Checks run one at a time, so one address
  // is one gNB on one address; the port must be 0 because a check can hold
  // its association open while the liveness probe dials a second one from
  // the same address, and only ephemeral ports keep the two distinct. A
  // fixed port is rejected as InvalidArgument. N3 is n3_bind.
  string bind_address = 12;
  // 3GPP release the core claims (15 = Rel-15). A check that requires a
  // newer release reports SKIP and never FAIL. 0 means the server default,
  // Rel-18 with TS 29.244 pinned to Rel-16, the same run the CLI makes with
  // no --target-release (docs/conformance/target-release.md). Each result
  // still states the release it requires.
  uint32 target_release = 13;
  // The UE the mobility checks register (a PDU session on one gNB, then an
  // Xn path switch to a second). Empty supi: no UE, and the mobility checks
  // report SKIP. With a supi, credentials and gnb_n3 are required; the
  // server keeps the keys out of results and logs.
  string supi = 14;               // digits or imsi-<digits>, in the request's PLMN
  Credentials credentials = 15;
  string dnn = 16;                // PDU session DNN; default "internet"
  string gnb_n3 = 17;             // gNB N3 IP, reachable from the UPF; both gNBs use it
  string traffic = 18;            // optional echo peer host:port for traffic across the handover
}

// ConformanceUpdate is one test's outcome, or (with done=true) the summary.
message ConformanceUpdate {
  ConformanceResult result = 1;   // absent on the final summary update
  bool done = 2;
  ConformanceTally tally = 3;     // running totals, present on every update
  // Position for progress display: test `index` of `total` selected.
  uint32 index = 4;
  uint32 total = 5;
  // The target release the run is gated on (0 = unset), on every update.
  uint32 target_release = 6;
  // The per-specification pins that narrowed the run ("TS 29.244" -> 16),
  // each at its effective release, on every update; empty when
  // target_release is 0 or no pin is older than it.
  map<string, uint32> spec_target_releases = 7;
}

message ConformanceResult {
  string id = 1;
  string category = 2;
  string spec_ref = 3;
  string verdict = 4;             // PASS | FAIL | ERROR | SKIP | DEVIATION
  string expected = 5;
  string observed = 6;
  string detail = 7;             // ends with the requirement line ("requires Rel-15 or later; <spec_ref>")
  // The references spec_ref renders, structured with their provenance.
  repeated SpecRef spec_refs = 8;
  uint32 min_release = 9;         // oldest release the check applies to
}

// SpecRef is one clause a conformance check asserts, with the 3GPP release
// provenance read in the 3GPP archive.
message SpecRef {
  string spec = 1;                // "TS 38.413"
  string clause = 2;              // exact paragraph, e.g. "10.3.5 Reject IE bullet 1"
  string strength = 3;            // shall | should | descriptive
  uint32 since = 4;               // earliest release the requirement appears in
  repeated SpecVersion verified = 5;
  repeated SpecChange changed = 6;
  bool wording_unchanged = 7;
  string rendered = 8;            // the one-line rendering, as in spec_ref
}

// SpecVersion is one specification version whose wording was read.
message SpecVersion {
  uint32 release = 1;
  string version = 2;             // "V16.18.0"
  string archive = 3;             // "38413-gi0.zip"
}

// SpecChange is one release whose wording or clause number differs from the
// release the requirement first appeared in.
message SpecChange {
  uint32 release = 1;
  string note = 2;
}

message ConformanceTally {
  uint32 passed = 1;
  uint32 failed = 2;
  uint32 errored = 3;
  uint32 skipped = 4;
  uint32 deviations = 5;
}

message ListConformanceTestsRequest {}

message ConformanceTestInfo {
  string id = 1;
  string category = 2;
  string spec_ref = 3;
  repeated SpecRef spec_refs = 4;
  uint32 min_release = 5;
}

message ListConformanceTestsResponse {
  repeated ConformanceTestInfo tests = 1;
}
