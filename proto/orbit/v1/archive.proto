syntax = "proto3";

package orbit.v1;

import "orbit/v1/run.proto";

option go_package = "github.com/bgrewell/orbit/gen/orbit/v1;orbitv1";

// RunArchive is one terminal run written to disk so it survives a restart.
//
// The registry holds runs in memory only, so restarting `orbit serve` used to
// empty the history — the run picker went blank, and a report could not be
// generated for a soak that finished shortly before a restart, which is
// exactly the run worth reporting on.
//
// It is a STORAGE format, deliberately not part of the RPC surface: nothing
// serves or accepts a RunArchive. It composes the same messages the handlers
// already return, so a restored run is served by handing back what was stored
// rather than by reconstructing engine state and re-deriving it. That is what
// keeps a restored run identical to a live one instead of a degraded copy.
message RunArchive {
  // Archive format version, so a future change can be detected rather than
  // mis-parsed. Readers reject what they do not understand; proto's own
  // field-level compatibility covers additive changes within a version.
  uint32 version = 1;

  // Identity and lifecycle, as ListRuns and GetRun report it.
  Run run = 2;

  // The final progress snapshot, as GetRun returned it at the moment the run
  // went terminal. Exactly one is set, matching the run's kind.
  LoadProgress load_progress = 3;
  FleetProgress fleet_progress = 4;

  // The end-of-run report. Absent unless the run reached COMPLETE — a failed
  // or cancelled run has no report, and GetRunReport refuses it on state.
  oneof report {
    LoadReport load_report = 5;
    FleetReport fleet_report = 6;
  }

  // The retained event log.
  repeated RunEvent events = 7;
  // How many events the ring evicted before the first retained one, so a
  // restored run reports the same gap a live one would rather than presenting
  // a truncated log as complete.
  uint64 events_dropped_before = 8;

  // The retained telemetry series, already trimmed of per-flow rows (the ring
  // stores them that way; the rows are transient and a finished run's are all
  // zero, while the flow COUNTS are kept).
  repeated TelemetryFrame frames = 9;

  // What the run was asked to do, kept verbatim so the archive is
  // self-describing. Without it a report says what happened but not what was
  // configured, and two runs cannot be meaningfully compared — the difference
  // between them is exactly the thing that is missing.
  //
  // Credentials are NOT stored: LoadRunSpec carries Ki/OPc, which have no place
  // in an artefact meant to be attached to a ticket. They are stripped before
  // the archive is written.
  oneof spec {
    LoadRunSpec load_spec = 10;
    FleetRunSpec fleet_spec = 11;
  }
}
