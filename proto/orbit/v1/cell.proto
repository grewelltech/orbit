syntax = "proto3";

package orbit.v1;

option go_package = "github.com/bgrewell/orbit/gen/orbit/v1;orbitv1";

// CellService manages gNB-side procedures. Phase-0 scope: a one-shot
// NG Setup exchange for substrate validation; persistent gNB/cell state
// management arrives with the Phase-1a engine.
service CellService {
  // RunNGSetup opens an SCTP association to the AMF, performs one
  // NG Setup exchange (TS 38.413 §8.7.1), and closes the association.
  rpc RunNGSetup(RunNGSetupRequest) returns (RunNGSetupResponse) {}
}

// Snssai is one supported network slice (TS 38.413 §9.3.1.24).
message Snssai {
  // Slice/Service Type, one octet (0-255).
  uint32 sst = 1;
  // Slice Differentiator as 6 hex digits (e.g. "010203"); empty = none.
  string sd = 2;
}

// GnbConfig identifies one simulated gNB toward the AMF.
message GnbConfig {
  // gNB identifier, carried as a bit string of id_bits bits.
  uint32 id = 1;
  // 22-32 (TS 38.413 §9.3.1.6); 0 defaults to 24.
  uint32 id_bits = 2;
  // Optional human-readable RAN node name.
  string name = 3;
  // Mobile country code, 3 digits.
  string mcc = 4;
  // Mobile network code, 2 or 3 digits.
  string mnc = 5;
  // Tracking area code, 24 bits.
  uint32 tac = 6;
  // Slices broadcast in the Supported TA List; at least one.
  repeated Snssai slices = 7;
}

message RunNGSetupRequest {
  // AMF N2 endpoint as host:port, e.g. "172.17.50.11:38412".
  string amf_address = 1;
  // Optional local N2 source address for the gNB's SCTP association, as ip
  // or ip:port (ip alone = ephemeral port). Empty: binds the address the host
  // routes to the AMF from (one address in the INIT), ephemeral port.
  string local_address = 2;
  GnbConfig gnb = 3;
  // Timeout in milliseconds for the dial (INIT exchange) plus the NG Setup
  // exchange, so an AMF that never answers fails within it; 0 defaults to
  // 10000. A hold (hold_ms) runs after it on its own clock and never extends
  // it.
  uint32 timeout_ms = 4;
  // Keep the association open this long after a successful NG Setup, in
  // milliseconds, so the AMF's SCTP heartbeat and anything it sends
  // unprompted can be observed; inbound NGAP is drained and logged. 0 closes
  // at once. Capped at 600000 (10 minutes): a larger value is
  // InvalidArgument. Not run after an NG Setup Failure.
  uint32 hold_ms = 5;
}

message RunNGSetupResponse {
  // True on NGSetupResponse, false on NGSetupFailure.
  bool accepted = 1;
  // AMF name from the response (empty on failure).
  string amf_name = 2;
  // Failure cause (empty on success).
  string cause = 3;
  // PPID carried by the AMF reply; 60 is compliant, 0x3c000000 is the
  // known SD-Core byte-swap quirk.
  uint32 reply_ppid = 4;
  // Local N2 source address the association actually used (host:port, with
  // the real port even when local_address asked for :0).
  string local_address = 5;
  // How long the association was actually held after the NG Setup Response,
  // in milliseconds: about hold_ms when the hold ran to completion, less when
  // the call was cancelled or the AMF closed the association first; 0 when
  // no hold was requested or NG Setup failed.
  uint32 held_ms = 6;
}
