syntax = "proto3";

package orbit.v1;

import "orbit/v1/cell.proto";
import "orbit/v1/options.proto";

option go_package = "github.com/bgrewell/orbit/gen/orbit/v1;orbitv1";

// ResolvedTarget is a target after layering (ADR-0008 §1, §3): the core,
// subscribers, RAN addressing and far ends a run uses, as the client's
// resolver produced them. It mirrors internal/target.Target. On the wire it
// carries the subscriber keys and tokens (marked secret, so they are refused
// over plaintext off the host and masked wherever they are stored).
message ResolvedTarget {
  string name = 1;
  TargetCore core = 2;
  repeated SubscriberPool subscribers = 3;
  TargetRAN ran = 4;
  TargetApp app = 5;
}

// TargetCore is the core under test.
message TargetCore {
  string amf = 1;                 // AMF N2 endpoint, host:port
  Plmn plmn = 2;
  uint32 tac = 3;
  repeated Snssai slices = 4;
  string dnn = 5;
  string profile = 6;             // core-compatibility profile, e.g. "sdcore"
  string upf_n3 = 7;              // UPF N3 endpoint, host:port
  repeated string ue_pools = 8;   // CIDRs the core gives UEs their addresses from
  string upf_n6 = 9;              // the UPF's N6 address: the return route's next hop
  string n6_subnet = 10;          // the N6 network (CIDR) the UPF sits on
}

// Plmn is a PLMN ID as typed: leading zeros are significant.
message Plmn {
  string mcc = 1;
  string mnc = 2;
}

// SubscriberPool is a block of provisioned subscribers and their keys.
message SubscriberPool {
  string name = 1;
  string first_supi = 2;
  uint32 count = 3;
  string ki = 4 [(orbit.v1.secret) = true];
  string opc = 5 [(orbit.v1.secret) = true];
  string routing_indicator = 6;
}

// TargetRAN is the RAN side's addressing and identity.
message TargetRAN {
  string node = 1;                // v1 accepts only "" (the server's own host)
  string gnb_name = 2;
  repeated string n2_source_ips = 3;  // pool: addresses, ranges or CIDRs
  repeated string n3_ips = 4;         // pool: addresses, ranges or CIDRs
  GNBIDRange gnb_ids = 5;
}

// GNBIDRange is the gNB IDs a target's runs may use.
message GNBIDRange {
  uint32 first = 1;
  uint32 count = 2;
  uint32 bits = 3;                // gNB ID length, 22..32
}

// TargetApp is the far end of the user plane.
message TargetApp {
  repeated Responder responders = 1;
}

// Responder is an N6 loom responder (ADR-0007).
message Responder {
  string name = 1;
  string control = 2;             // control address, host:port
  string token = 3 [(orbit.v1.secret) = true];
  string data_ip = 4;             // media address when it differs from the control host
}

// FieldProvenance says where one resolved field came from (ADR-0008 §3).
// The client's resolver masks a secret field's value; the server masks it
// again by path (any entry whose path names a field marked secret), and
// scrubs request secrets by value wherever it stores provenance.
message FieldProvenance {
  string path = 1;                // canonical path, e.g. "core.plmn.mcc"
  ProvenanceSource source = 2;
  string value = 3;
  repeated ProvenanceOverride overridden = 4;  // lower layers this one replaced
}

// ProvenanceSource is a layer and where in it.
message ProvenanceSource {
  ProvenanceLayer layer = 1;
  string detail = 2;              // file:line, env var or flag name
}

// ProvenanceLayer is a resolution layer, lowest first.
enum ProvenanceLayer {
  PROVENANCE_LAYER_UNSPECIFIED = 0;
  PROVENANCE_LAYER_DEFAULT = 1;
  PROVENANCE_LAYER_TARGET = 2;
  PROVENANCE_LAYER_RUN_FILE = 3;
  PROVENANCE_LAYER_ENV = 4;
  PROVENANCE_LAYER_FLAG = 5;
  PROVENANCE_LAYER_LEASE = 6;     // allocated by the server (§5)
}

// ProvenanceOverride is a value a higher layer replaced.
message ProvenanceOverride {
  ProvenanceSource source = 1;
  string value = 2;
}

// TargetService checks a target from the server (ADR-0009 §5).
service TargetService {
  // Probe runs the doctor against a resolved target: NG Setup, a UE's
  // registration and PDU session, then (unless core_only) the N6 responder:
  // registered and online, its control port, an echo and a UDP flow from the
  // UE. It takes its gNB IDs and SUPI as leases, as a run does, streams one
  // step per message, and stops at the first failure (the rest SKIP).
  rpc Probe(ProbeRequest) returns (stream ProbeStep) {}
}

message ProbeRequest {
  ResolvedTarget target = 1;
  string target_name = 2;      // for the messages
  bool core_only = 3;          // steps 1-3 only
  uint32 step_timeout_ms = 4;  // 0 = 20 s
}

message ProbeStep {
  uint32 index = 1;   // 1-7
  string name = 2;
  string status = 3;  // "OK", "FAIL" or "SKIP"
  string detail = 4;  // what was seen
  string fix = 5;     // what to change, on a FAIL
}

// ResolveRequest is a run as a client sends it whole (ADR-0008 §3): the
// target document and the run file as YAML text, which the server parses
// as the CLI parses its files, and the layers above them. There is no env
// layer: a ${VAR} takes its value from vars, never from the server's
// environment, and one with no value is an error naming it.
message ResolveRequest {
  string target_yaml = 1 [(orbit.v1.secret_yaml) = true];  // one kind: target document
  string run_yaml = 2 [(orbit.v1.secret_yaml) = true];     // one kind: run document
  string template = 3;          // the built-in template run_yaml started from, or ""
  // The flag layer: --set path=value. Marked secret, so a set is refused
  // over plaintext off loopback before it is read; the server refuses one
  // at a secret field (keys go in the target, as ${VAR}s) in any case.
  repeated string sets = 4 [(orbit.v1.secret) = true];
  repeated string gates = 5;    // the flag layer: --gate specs
  repeated Variable vars = 6;   // the ${VAR}s' values
}

// Variable is one ${VAR}'s value. Every value counts as a secret: a name
// does not say whether it holds a key.
message Variable {
  string name = 1;
  string value = 2 [(orbit.v1.secret) = true];
}
